<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarization and Text-to-Speech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/index.css') }}">
</head>
<body>
    <h1>Text Summarization and Text-to-Speech</h1>
    <form action="/summarize" method="POST">
        <label for="text">Enter Text:</label><br>
        <textarea name="text" id="text" rows="10" cols="50" required></textarea><br><br>
        <button type="submit">Generate Summary & Audio</button>
    </form>

    {% if summary %}
    <h2>Summary:</h2>
    <p>{{ summary }}</p>
    <h3>Download Audio:</h3>
    <a href="{{ url_for('static', filename='summary_audio.mp3') }}" download>Download Summary Audio</a>
    {% endif %}

    <br><br>
    <a href="{{ url_for('speech_to_text') }}">Go to Speech-to-Text</a>
</body>
</html>
